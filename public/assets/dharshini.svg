<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132D" />
      <stop offset="50%" stop-color="#1B1238" />
      <stop offset="100%" stop-color="#03040B" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42D9FF" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Orbital Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#42D9FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#A78BFA" stroke-width="1" stroke-dasharray="12 8" opacity="0.2" />

  <!-- Cosmic Particles / Stars -->
  <circle cx="90" cy="80" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="310" cy="95" r="2.5" fill="#42D9FF" opacity="0.9" filter="url(#glow)" />
  <circle cx="330" cy="280" r="1.8" fill="#FFB347" opacity="0.7" />
  <circle cx="70" cy="300" r="2.2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="200" cy="40" r="1.5" fill="#42D9FF" opacity="0.8" />

  <!-- Soft Head Glow Halo -->
  <circle cx="200" cy="180" r="95" fill="#42D9FF" opacity="0.12" filter="url(#glow)" />

  <!-- Body / Shoulders (Modern Cosmic Astronaut / Developer Suit) -->
  <path d="M 120 380 C 120 300, 150 280, 200 280 C 250 280, 280 300, 280 380 Z" fill="url(#suitGrad)" stroke="#42D9FF" stroke-width="2" opacity="0.95" />
  <!-- Collar Trim -->
  <path d="M 160 285 Q 200 310 240 285" fill="none" stroke="url(#cyanPurple)" stroke-width="4" stroke-linecap="round" />
  <!-- Suit Mission Patch / Icon -->
  <circle cx="200" cy="335" r="14" fill="#07132D" stroke="#42D9FF" stroke-width="1.5" />
  <text x="200" y="340" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="11" fill="#42D9FF" text-anchor="middle">&lt;/&gt;</text>

  <!-- Head Silhouette / Hair -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="#0C1425" stroke="#A78BFA" stroke-width="2" />
  
  <!-- Sleek Visor / Coding HUD -->
  <path d="M 155 160 Q 200 148 245 160 Q 250 200 200 208 Q 150 200 155 160 Z" fill="url(#cyanPurple)" opacity="0.85" filter="url(#glow)" />
  <path d="M 165 172 Q 200 162 235 172" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" stroke-linecap="round" />

  <!-- Monogram Initials Badge -->
  <g transform="translate(200, 240)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#07132D" stroke="#42D9FF" stroke-width="1.5" filter="url(#glow)" />
    <text x="0" y="5" font-family="'Orbitron', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">D • T</text>
  </g>
</svg>

